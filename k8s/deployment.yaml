apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-security-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-security-pipeline
  template:
    metadata:
      labels:
        app: k8s-security-pipeline
    spec:
      containers:
        - name: backend
          image: k8s-security-pipeline:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orderly-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: orderly-secrets
                  key: jwt-secret-key
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
