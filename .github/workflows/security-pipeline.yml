name: Security Pipeline

permissions:
  contents: read
  id-token: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt || true
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t k8s-security-pipeline:latest -f docker/Dockerfile .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: k8s-security-pipeline:latest
          severity: CRITICAL,HIGH
  sbom-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t k8s-security-pipeline:latest -f docker/Dockerfile .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: k8s-security-pipeline:latest
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
  k8s-policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Kyverno policies
        run: git clone https://github.com/kyverno/policies.git

      - name: Check manifests against best-practices policies
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/kyverno/kyverno-cli:latest \
            apply policies/pod-security/baseline --resource k8s/deployment.yaml
  runtime-rules-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Falco rules syntax
        run: |
          docker run --rm -v "$PWD/security/falco":/rules \
            falcosecurity/falco:latest \
            falco --validate /rules/custom_rules.yaml
  security-gate:
    runs-on: ubuntu-latest
    needs: [code-scan, secret-scan, dependency-scan, image-scan, sbom-generation, k8s-policy-check, runtime-rules-check, dast-scan]
    if: always()
    steps:
      - name: Evaluate results and generate summary
        run: |
          echo "## 🛡️ Security Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Couche | Job | Résultat |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Code (Semgrep) | code-scan | ${{ needs.code-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Secrets (Gitleaks) | secret-scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Dépendances (pip-audit) | dependency-scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4. Image Docker (Trivy) | image-scan | ${{ needs.image-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5. SBOM (Syft) | sbom-generation | ${{ needs.sbom-generation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6. Kubernetes (Kyverno) | k8s-policy-check | ${{ needs.k8s-policy-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7. Runtime (Falco) | runtime-rules-check | ${{ needs.runtime-rules-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 8. Application en fonctionnement (OWASP ZAP) | dast-scan | ${{ needs.dast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 9. Cluster Kubernetes (kube-bench) | k8s-cluster-benchmark | ${{ needs.k8s-cluster-benchmark.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Block on critical failures
        run: |
          if [[ "${{ needs.code-scan.result }}" == "failure" || \
                "${{ needs.secret-scan.result }}" == "failure" || \
                "${{ needs.image-scan.result }}" == "failure" || \
                "${{ needs.k8s-policy-check.result }}" == "failure" || \
                "${{ needs.runtime-rules-check.result }}" == "failure" ]]; then
            echo " Une couche critique a échoué. Fusion bloquée."
            exit 1
          fi
          echo " Toutes les couches critiques sont passées."
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t k8s-security-pipeline:latest -f docker/Dockerfile .

      - name: Start application container
        run: |
          docker run -d --name backend-test -p 8000:8000 \
            -e DATABASE_URL="sqlite:///./test.db" \
            -e JWT_SECRET_KEY="test-secret-key-for-dast-only" \
            k8s-security-pipeline:latest

          for i in {1..15}; do
            if curl -s http://localhost:8000/docs > /dev/null; then
              echo "L'application répond."
              break
            fi
            echo "En attente du démarrage..."
            sleep 2
          done

          docker logs backend-test
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-a'
          issue_title: 'ZAP DAST Scan Report'
        continue-on-error: true
  k8s-cluster-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Run kube-bench
        run: |
          docker run --rm --pid=host \
            -v /etc:/etc:ro \
            -v /var:/var:ro \
            -v "$(which kubectl)":/usr/local/bin/kubectl \
            -v ~/.kube:/root/.kube:ro \
            --network host \
            aquasecurity/kube-bench:latest \
            --benchmark cis-1.24 || true
  sign-image:
    runs-on: ubuntu-latest
    needs: [image-scan]
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker build -t $IMAGE -f docker/Dockerfile .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Sign image with Cosign (keyless)
        run: cosign sign --yes $IMAGE
