name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt || true
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t k8s-security-pipeline:latest -f docker/Dockerfile .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: k8s-security-pipeline:latest
          severity: CRITICAL,HIGH
  sbom-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t k8s-security-pipeline:latest -f docker/Dockerfile .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: k8s-security-pipeline:latest
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
  k8s-policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Kyverno policies
        run: git clone https://github.com/kyverno/policies.git

      - name: Check manifests against best-practices policies
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/kyverno/kyverno-cli:latest \
            apply policies/pod-security/baseline --resource k8s/deployment.yaml
  runtime-rules-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Falco rules syntax
        run: |
          docker run --rm -v "$PWD/security/falco":/rules \
            falcosecurity/falco:latest \
            falco --validate /rules/custom_rules.yaml
  security-gate:
    runs-on: ubuntu-latest
    needs: [code-scan, secret-scan, dependency-scan, image-scan, sbom-generation, k8s-policy-check, runtime-rules-check]
    if: always()
    steps:
      - name: Evaluate results and generate summary
        run: |
          echo "## 🛡️ Security Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Couche | Job | Résultat |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Code (Semgrep) | code-scan | ${{ needs.code-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Secrets (Gitleaks) | secret-scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Dépendances (pip-audit) | dependency-scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4. Image Docker (Trivy) | image-scan | ${{ needs.image-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5. SBOM (Syft) | sbom-generation | ${{ needs.sbom-generation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6. Kubernetes (Kyverno) | k8s-policy-check | ${{ needs.k8s-policy-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7. Runtime (Falco) | runtime-rules-check | ${{ needs.runtime-rules-check.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Block on critical failures
        run: |
          if [[ "${{ needs.code-scan.result }}" == "failure" || \
                "${{ needs.secret-scan.result }}" == "failure" || \
                "${{ needs.image-scan.result }}" == "failure" || \
                "${{ needs.k8s-policy-check.result }}" == "failure" || \
                "${{ needs.runtime-rules-check.result }}" == "failure" ]]; then
            echo "❌ Une couche critique a échoué. Fusion bloquée."
            exit 1
          fi
          echo "✅ Toutes les couches critiques sont passées."
